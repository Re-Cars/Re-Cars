<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RE|CARS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style-base.css">
    <link rel="stylesheet" href="style-auth.css">
    <script src="functions-base.js" defer></script>
    <script src="functions-auth.js" defer></script>
</head>

<body class="auth-body">

    <div class="landing-overlay"></div>

    <!-- display:none inline: nascosto fin dal primo render (niente flash prima
         che il JS carichi); openGarage() lo mostra impostando display:flex -->
    <div class="auth-container" style="display: none;">
      <div class="auth-scroll">

        <div class="auth-nav">
            <a href="#" class="auth-back" onclick="closeGarage(event)" aria-label="Torna alla landing">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="auth-toggle-slot">
                <a href="#" class="auth-toggle-left" id="auth-toggle-left" onclick="switchForm(event)">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Accedi</span>
                </a>
                <a href="#" id="auth-toggle-nav" onclick="switchForm(event)">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>Registrati</span>
                </a>
            </div>
        </div>

        <div class="auth-logo">
            <img src="Img/LOGO/solo-logo-C-e-O/SVG/logotipo.svg" alt="Logo RE|CARS" class="auth-logo-img">
            <h1 class="landing-title2">RE|CARS</h1>
        </div>

        <!-- ─── LOGIN ─────────────────────────────────── -->
        <div class="auth-form-wrapper active" id="wrapper-login">

            <!-- step 1: chi sei? -->
            <div class="auth-step" id="login-step-tipo">
                <div class="auth-tipo-group">
                    <button class="auth-tipo-btn" onclick="loginSelezionaTipo('utente')">
                        <i class="fa-solid fa-user"></i>
                        <span>Utente</span>
                    </button>
                    <button class="auth-tipo-btn" onclick="loginSelezionaTipo('business')">
                        <i class="fa-solid fa-building"></i>
                        <span>Business</span>
                    </button>
                </div>
            </div>

            <!-- step 2a: login utente -->
            <div class="auth-step hidden" id="login-step-utente">
                <button class="auth-back-step" onclick="loginTornaATipo()">
                    <i class="fa-solid fa-arrow-left"></i> Indietro
                </button>
                <div class="auth-form">
                    <div class="input-group">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="login-email" placeholder="Email">
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="login-password" placeholder="Password">
                    </div>
                    <p id="login-error" class="auth-error"></p>
                    <button class="btn-landing btn-login" onclick="login('utente')">
                        <i class="fa-solid fa-right-to-bracket"></i> ACCEDI
                    </button>
                </div>
            </div>

            <!-- step 2b: login business (azienda o officina) -->
            <div class="auth-step hidden" id="login-step-business">
                <button class="auth-back-step" onclick="loginTornaATipo()">
                    <i class="fa-solid fa-arrow-left"></i> Indietro
                </button>
                <div class="auth-tipo-group" style="margin-bottom: 16px;">
                    <button class="auth-tipo-btn" id="login-btn-azienda" onclick="loginSelezionaBusiness('azienda')">
                        <i class="fa-solid fa-briefcase"></i>
                        <span>Azienda</span>
                    </button>
                    <button class="auth-tipo-btn" id="login-btn-officina" onclick="loginSelezionaBusiness('officina')">
                        <i class="fa-solid fa-screwdriver-wrench"></i>
                        <span>Officina</span>
                    </button>
                </div>
                <div class="auth-form">
                    <div class="input-group">
                        <i class="fa-solid fa-file-invoice"></i>
                        <input type="text" id="login-piva" placeholder="Partita IVA">
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="login-password-business" placeholder="Password">
                    </div>
                    <p id="login-error-business" class="auth-error"></p>
                    <button class="btn-landing btn-login" onclick="login('business')">
                        <i class="fa-solid fa-right-to-bracket"></i> ACCEDI
                    </button>
                </div>
            </div>

            <p class="auth-switch">Non hai un account? <a href="#" onclick="switchForm(event)">Registrati</a></p>
        </div>

        <!-- ─── REGISTER ──────────────────────────────── -->
        <div class="auth-form-wrapper" id="wrapper-register">

            <!-- step 1: chi sei? -->
            <div class="auth-step" id="reg-step-tipo">
                <div class="auth-tipo-group">
                    <button class="auth-tipo-btn" onclick="regSelezionaTipo('privato')">
                        <i class="fa-solid fa-user"></i>
                        <span>Privato</span>
                    </button>
                    <button class="auth-tipo-btn" onclick="regSelezionaTipo('azienda')">
                        <i class="fa-solid fa-briefcase"></i>
                        <span>Azienda</span>
                    </button>
                    <button class="auth-tipo-btn" onclick="regSelezionaTipo('officina')">
                        <i class="fa-solid fa-screwdriver-wrench"></i>
                        <span>Officina</span>
                    </button>
                </div>
            </div>

            <!-- step 2: form registrazione -->
            <div class="auth-step hidden" id="reg-step-form">
                <button class="auth-back-step" onclick="regTornaATipo()">
                    <i class="fa-solid fa-arrow-left"></i> Indietro
                </button>

                <!-- privato -->
                <div class="auth-form hidden" id="reg-form-privato">
                    <div class="input-group">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="reg-username" placeholder="Username">
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="reg-email" placeholder="Email">
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="reg-password" placeholder="Password">
                    </div>
                </div>

                <!-- azienda -->
                <div class="auth-form hidden" id="reg-form-azienda">
                    <div class="input-group">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="reg-az-username" placeholder="Username">
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="reg-az-email" placeholder="Email">
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="reg-az-password" placeholder="Password">
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-building"></i>
                        <input type="text" id="reg-az-ragione-sociale" placeholder="Ragione Sociale">
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-file-invoice"></i>
                        <input type="text" id="reg-az-piva" placeholder="Partita IVA">
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-file-invoice"></i>
                        <input type="text" id="reg-az-sdi" placeholder="Codice SDI (opzionale)">
                    </div>
                </div>

                <!-- officina -->
                <div class="auth-form hidden" id="reg-form-officina">
                    <div class="input-group">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="reg-of-email" placeholder="Email">
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="reg-of-password" placeholder="Password">
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-store"></i>
                        <input type="text" id="reg-of-nome" placeholder="Nome Officina">
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-building"></i>
                        <input type="text" id="reg-of-ragione-sociale" placeholder="Ragione Sociale">
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-file-invoice"></i>
                        <input type="text" id="reg-of-piva" placeholder="Partita IVA">
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-file-invoice"></i>
                        <input type="text" id="reg-of-sdi" placeholder="Codice SDI (opzionale)">
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-phone"></i>
                        <input type="text" id="reg-of-telefono" placeholder="Telefono">
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-location-dot"></i>
                        <input type="text" id="reg-of-indirizzo" placeholder="Indirizzo">
                    </div>
                    <!-- dropdown città con ricerca -->
                    <div class="input-group" style="position:relative;">
                        <i class="fa-solid fa-city"></i>
                        <input type="text" id="reg-of-citta-input" placeholder="Città (es. Milano)" autocomplete="off" oninput="cercaCitta(this.value)">
                        <input type="hidden" id="reg-of-citta-sigla">
                        <div class="citta-dropdown" id="citta-dropdown"></div>
                    </div>
                </div>

                <p id="reg-error" class="auth-error"></p>
                <button class="btn-landing btn-register" style="width:100%; justify-content:center; margin-top:8px;" onclick="register()">
                    <i class="fa-solid fa-user-plus"></i> REGISTRATI
                </button>
            </div>

            <p class="auth-switch">Hai già un account? <a href="#" onclick="switchForm(event)">Accedi</a></p>
        </div>

      </div>
    </div>

     <div class="shutter-gate" id="shutter-gate">
        <div class="landing-overlay"></div>
        <div class="landing-content">
            <div class="brand-group">
                <div class="landing-logo" id="landing-logo">
                    <svg id="logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50.54 35.951">
                        <path class="logo-path" id="logo-path"
                            d="M44.234,35.083c0,3.957,2.775,5.643,5.032,6.6a7.812,7.812,0,0,0,7.165-.454,7.39,7.39,0,0,0,3.412-6.444v-.035a4.361,4.361,0,0,0-4.361-4.511H17.873a4.347,4.347,0,0,0-4.344,4.511v.035a7.39,7.39,0,0,0,3.412,6.444,7.812,7.812,0,0,0,7.165.454c2.257-.958,5.033-2.941,5.033-6.9,0-6.835-7.881-9.074-7.881-9.074l-3.605-.259a4.046,4.046,0,0,1-4.124-4.017V14.157a4.206,4.206,0,0,1,4.206-4.206H35.569c12.053,1.061,22.167,9.687,23.882,11.023A2.694,2.694,0,0,1,60.5,23.093h0a2.658,2.658,0,0,1-2.657,2.657h-12.8a7.578,7.578,0,0,1-7.578-7.577V15.71"
                            transform="translate(-11.745 -8.17)"/>
                    </svg>
                </div>
                <h1 class="landing-title" id="landing-title">RE|CARS</h1>
                <p class="landing-subtitle" id="landing-subtitle"><i>Tu guida al resto pensiamo noi</i></p>
            </div>
 
            <div class="action-group" id="action-group">
                <div class="scroll-hint" id="scroll-hint">
                    <span>Scorri</span>
                    <div class="scroll-arrows">
                        <i class="fa-solid fa-chevron-up"></i>
                        <i class="fa-solid fa-chevron-up"></i>
                        <i class="fa-solid fa-chevron-up"></i>
                    </div>
                </div>
            </div>
 
            <div class="landing-buttons" id="landing-buttons">
                <button type="button" class="btn-landing" onclick="openGarage()">ACCEDI</button>
            </div>
        </div>
    </div>

</body>
</html>

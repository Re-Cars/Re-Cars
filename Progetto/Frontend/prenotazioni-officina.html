<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RE|CARS — Prenotazioni</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style-base.css">
    <link rel="stylesheet" href="style-app.css">
    <link rel="stylesheet" href="style-officina.css">
    <script src="functions-base.js" defer></script>
    <script src="functions-app.js" defer></script>
    <script src="functions-prenotazioni-officina.js" defer></script>
</head>

<body>

    <div class="oc-detail-overlay" id="oc-detail-overlay">
        <div class="oc-new-modal">
            <div class="oc-new-modal-header">
                <div class="oc-new-modal-title">
                    <i class="fa-solid fa-calendar-check"></i>
                    Dettaglio prenotazione
                </div>
                <div class="oc-new-modal-header-right">
                    <span id="oc-detail-stato-badge"></span>
                    <button class="oc-detail-close" onclick="chiudiDettaglio()">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>
            <div class="oc-new-modal-body" id="oc-detail-content"></div>
            <div class="oc-new-modal-footer" id="oc-detail-azioni"></div>
        </div>
    </div>

    <div class="hamburger-overlay" id="hamburger-overlay" onclick="closeMenu()"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="Img/LOGO/solo-logo-C-e-O/SVG/logotipo.svg" alt="logo" class="sidebar-logo-img">
            <span class="sidebar-brand">RE<span>|</span>CARS</span>
            <div class="hamburger9" id="hamburger9" onclick="toggleMenu()">
                <span class="line line1"></span>
                <span class="line line2"></span>
                <span class="line line3"></span>
                <span class="line line4"></span>
            </div>
        </div>
            <nav class="sidebar-nav">
                <a href="profilo-officina.html"><i class="fa-solid fa-building-user"></i> Profilo Officina</a>
                <a href="prenotazioni-officina.html"><i class="fa-solid fa-calendar-check"></i> Prenotazioni</a>
                <a href="officina-agenda.html"><i class="fa-solid fa-calendar-days"></i> Agenda</a>
                <a href="abbonamenti-officina.html"><i class="fa-solid fa-credit-card"></i> Abbonamento</a>
                <a href="#" class="sidebar-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
            </nav>
    </div>

    <header class="header">
        <div class="header-left"></div>
        <div class="header-center">
            <a href="officina.html">
                <img src="Img/LOGO/solo-logo-C-e-O/SVG/logotipo.svg" alt="logo" class="header-logo-img">
                <span class="header-brand">RE<span>|</span>CARS</span>
            </a>
        </div>
        <div class="header-right">
            <button id="theme-toggle" onclick="toggleTheme()" class="theme-toggle-btn">
                <i class="fa-solid fa-moon" id="theme-icon"></i>
            </button>
            <div class="header-avatar-wrapper" id="avatar-wrapper" onclick="toggleAvatarMenu()">
                <div class="header-avatar">
                    <i class="fa-solid fa-building-user"></i>
                </div>
                <div class="avatar-dropdown" id="avatar-dropdown">
                    <div class="avatar-header">
                        <p class="avatar-header-name">Ciao, <span id="avatar-dropdown-name"></span></p>
                    </div>
                    <a href="profilo-officina.html" class="avatar-item">
                        <i class="fa-solid fa-pen"></i>
                        <span>Modifica profilo</span>
                    </a>
                    <a href="#" class="avatar-item avatar-item-logout" onclick="logout()">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Logout</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <div class="breadcrumb">
        <a href="officina.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
        <span>›</span>
        <span>Prenotazioni</span>
    </div>

    <div class="oc-intro">
        <div class="oc-intro-left">
            <div class="oc-office-avatar">
                <i class="fa-solid fa-calendar-check"></i>
            </div>
            <div>
                <div class="oc-office-name">Prenotazioni</div>
                <div class="oc-office-sub">
                    <i class="fa-solid fa-building-user"></i>
                    <span id="nome-officina-header">—</span>
                </div>
            </div>
        </div>
    </div>

    <div class="oc-filters-wrapper">
        <div class="oc-filters">
            <span class="oc-filter-label">Filtra</span>
            <button class="oc-filter-btn active-all" onclick="setFiltro('all', this)">Tutte</button>
            <button class="oc-filter-btn" onclick="setFiltro('in_attesa', this)">
                <span class="oc-filter-dot oc-dot-attesa"></span> In attesa
            </button>
            <button class="oc-filter-btn" onclick="setFiltro('confermata', this)">
                <span class="oc-filter-dot oc-dot-confermata"></span> Confermate
            </button>
            <button class="oc-filter-btn" onclick="setFiltro('completata', this)">
                <span class="oc-filter-dot oc-dot-completata"></span> Completate
            </button>
            <button class="oc-filter-btn" onclick="setFiltro('annullata', this)">
                <span class="oc-filter-dot oc-dot-annullata"></span> Annullate
            </button>
            <span class="oc-count-pill oc-count-pill-right" id="pren-count">0 prenotazioni</span>
        </div>
    </div>

    <div class="oc-prenotazioni-list" id="prenotazioni-list"></div>
    <div class="oc-empty-state oc-empty-state-outer" id="empty-state">
        <i class="fa-solid fa-calendar-xmark"></i>
        <span>Nessuna prenotazione trovata</span>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RE|CARS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style-base.css">
    <link rel="stylesheet" href="style-auth.css">
    <script src="functions-base.js" defer></script>
    <script src="functions-auth.js" defer></script>
</head>

<body class="auth-body">

    <div class="landing-overlay"></div>

    <div class="auth-container">
        <div class="auth-nav">
            <a href="landing.html" class="auth-back">
                <i class="fa-solid fa-arrow-left"></i> Torna indietro
            </a>
            <a href="register.html" class="auth-back">
                Registrati <i class="fa-solid fa-arrow-right"></i>
            </a>
        </div>
        <div class="auth-logo">
            <img src="Progetto/Frontend/Img/LOGO/solo logo C e O/SVG/likeAsset 6@72x.svg" alt="Logo RE|CARS" class="auth-logo-img">
            <h1 class="landing-title">RE|CARS</h1>
        </div>

        <div class="auth-form">
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="login-email" placeholder="Email">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="login-password" placeholder="Password">
            </div>
            <p id="login-error" class="auth-error"></p>
            <button class="btn-landing btn-login" onclick="login()">ACCEDI</button>
        </div>

        <p class="auth-switch">Non hai un account? <a href="register.html">Registrati</a></p>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RE|CARS — Pagamento completato</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style-base.css">
    <link rel="stylesheet" href="style-app.css">
    <link rel="stylesheet" href="style-account.css">
    <script src="functions-base.js" defer></script>
</head>

<body>

    <header class="header">
        <div class="header-left"></div>
        <div class="header-center">
            <a href="officina.html">
                <img src="Img/LOGO/solo-logo-C-e-O/SVG/logotipo.svg" alt="logo" class="header-logo-img">
                <span class="header-brand">RE<span>|</span>CARS</span>
            </a>
        </div>
        <div class="header-right"></div>
    </header>

    <div class="ps-wrap">
        <div class="ps-card">

            <div class="ps-icon-wrap">
                <div class="ps-icon-ring"></div>
                <div class="ps-icon-ring ps-icon-ring2"></div>
                <div class="ps-icon-circle">
                    <i class="fa-solid fa-check"></i>
                </div>
            </div>

            <span class="ps-badge">
                <span class="ps-badge-dot"></span>
                Abbonamento attivo
            </span>

            <span class="ps-brand">RE|CARS</span>

            <h1 class="ps-title">Pagamento completato!</h1>
            <p class="ps-sub">Il tuo abbonamento è stato attivato con successo. Riceverai una conferma via email a breve.</p>

            <div class="ps-divider"></div>

            <div class="ps-links">
                <a href="abbonamenti-officina.html" class="ps-link">
                    <i class="fa-solid fa-credit-card ps-link-icon"></i>
                    Vedi abbonamento
                </a>
                <span class="ps-link-sep">|</span>
                <a href="officina.html" class="ps-link">
                    <i class="fa-solid fa-house ps-link-icon"></i>
                    Torna alla home
                </a>
            </div>

        </div>
    </div>

</body>
</html>

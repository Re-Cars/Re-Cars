<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RE|CARS - Elenco veicoli</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style-base.css">
    <link rel="stylesheet" href="style-app.css">
    <link rel="stylesheet" href="style-veicoli.css">
    <script src="functions-base.js" defer></script>
    <script src="functions-app.js" defer></script>
    <script src="functions-veicoli.js" defer></script>
</head>

<body>

    <div class="hamburger-overlay" id="hamburger-overlay" onclick="closeMenu()"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="Img/LOGO/solo-logo-C-e-O/SVG/logotipo.svg" alt="logo" class="sidebar-logo-img">
            <span class="sidebar-brand">RE<span>|</span>CARS</span>

            <div class="hamburger9" id="hamburger9" onclick="toggleMenu()">
                <span class="line line1"></span>
                <span class="line line2"></span>
                <span class="line line3"></span>
                <span class="line line4"></span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="homepage.html" class="sidebar-home"><i class="fa-solid fa-house"></i> Home</a>
            <a href="account.html" class="sidebar-account"><i class="fa-solid fa-user"></i> Il mio account</a>
            <a href="veicoli.html" class="sidebar-veicolo"><i class="fa-solid fa-car"></i> Veicolo</a>
            <a href="abbonamenti.html"><i class="fa-solid fa-credit-card"></i> Abbonamenti </a>
            <a href="info-domande.html"><i class="fa-solid fa-circle-info"></i> Info e domande utili</a>
            <a href="#top"><i class="fa-solid fa-envelope"></i> Contatti</a>
            <a href="termini-privacy.html"><i class="fa-solid fa-file-shield"></i> Termini e privacy policy</a>
            <a href="landing.html" class="sidebar-logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </nav>
    </div>

    <header class="header">
        <div class="header-left"></div>
        <div class="header-center">
            <a href="homepage.html">
                <img src="Img/LOGO/solo-logo-C-e-O/SVG/logotipo.svg" alt="logo" class="header-logo-img">
                <span class="header-brand">RE<span>|</span>CARS</span>
            </a>
        </div>
        <div class="header-right">
            <button id="theme-toggle" onclick="toggleTheme()" style="background:none; border:none; cursor:pointer; color:#f97316; font-size:1.1rem; padding:4px 8px;">
                <i class="fa-solid fa-moon" id="theme-icon"></i>
            </button>

            <div class="header-avatar-wrapper" id="avatar-wrapper" onclick="toggleAvatarMenu()">
                <div class="header-avatar">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="avatar-dropdown" id="avatar-dropdown">
                    <div class="avatar-header">
                        <p class="avatar-header-name">Ciao, <span id="avatar-dropdown-name"></span></p>
                    </div>
                    <a href="account.html" class="avatar-item">
                        <i class="fa-solid fa-pen"></i>
                        <span>Modifica profilo</span>
                    </a>
                    <a href="landing.html" class="avatar-item avatar-item-logout">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Logout</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <div class="breadcrumb">
        <a href="homepage.html"><i class="fa-solid fa-house"></i> Home</a>
        <span>›</span>
        <span>I miei veicoli</span>
    </div>

    <section class="home-intro">
        <div class="home-intro-veicolo" id="home-intro-veicolo">
            <i class="fa-solid fa-car" id="veicolo-tipo-icon"></i>
            <span class="veicolo-nome" id="nome-veicolo-attivo">Caricamento...</span>
            <span class="veicolo-sep">·</span>
            <span class="veicolo-targa" id="targa-veicolo-attivo"></span>
        </div>
        <div class="veicolo-switcher" id="veicolo-switcher">
            <button class="switcher-btn" id="switcher-btn" onclick="toggleSwitcher()">
                <span id="switcher-label">
                    <i class="fa-solid fa-warehouse"></i>
                    <span id="veicoli-counter"></span>
                </span>
                <i class="fa-solid fa-chevron-down" id="switcher-icon"></i>
            </button>
            <div class="switcher-dropdown" id="switcher-dropdown"></div>
        </div>
    </section>

    <section class="vl-dashboard">

        <div class="vl-section-card">
            <div class="vl-section-bar">
                <i class="fa-solid fa-car"></i>
                <span>Veicoli registrati</span>
            </div>
            <div class="vl-section-body" id="vl-lista-veicoli">
            </div>
        </div>

        <div class="vl-aggiungi-wrap">
            <div class="switcher-aggiungi-btn-wrap">
                <button class="switcher-aggiungi-btn" onclick="location.href='cerca-veicolo.html'">
                    <div class="switcher-plus-circle"><i class="fa-solid fa-plus"></i></div>
                    Aggiungi veicolo
                </button>
            </div>
        </div>

    </section>

</body>
</html>

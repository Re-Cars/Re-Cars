name: CI Backend

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Progetto/Backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: Progetto/Backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: |
          if [ -f prisma.config.ts ] && [ ! -f prisma/prisma.config.ts ]; then
            cp prisma.config.ts prisma/prisma.config.ts
          fi
          pnpm exec prisma generate

      - name: Run Linter
        run: pnpm run lint

      - name: Run Tests
        run: pnpm run test
name: CI Backend

on:
  push:
    branches: [ main, master, test-ci ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Progetto/Backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Configurazione della cache con percorso fisso per Linux (Ubuntu)
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store/v3
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('Progetto/Backend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Generate Prisma Client
        run: |
          mkdir -p prisma
          if [ -f prisma.config.ts ] && [ ! -f prisma/prisma.config.ts ]; then
            cp prisma.config.ts prisma/prisma.config.ts
          fi
          pnpm exec prisma generate

      - name: Run Linter
        run: pnpm run lint

      - name: Run Tests
        run: pnpm run test
<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOUdrive — Visitatore</title>
    <link rel="stylesheet" href="style-base.css">
    <link rel="stylesheet" href="style-auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="functions.js" defer></script>
</head>

<body>

    <header class="header">
        <a href="landing.html" class="auth-back">
            <i class="fa-solid fa-arrow-left"></i> Torna indietro
        </a>
        <div class="header-logo">YouDrive</div>
        <div></div>
    </header>

    <section class="page-hero">
        <h2 class="section-title-page">Cerca Veicolo</h2>
        <p class="page-hero-sub">Inserisci una targa per visualizzare i dati del veicolo</p>
    </section>

    <section class="section">
        <div class="section-row-page">

            <div class="card">
                <h3><i class="fa-solid fa-magnifying-glass"></i> Ricerca per Targa</h3>
                <p>Inserisci la targa del veicolo che vuoi consultare.</p>
                <div class="input-group">
                    <i class="fa-solid fa-car"></i>
                    <input type="text" id="input-targa-visitor" placeholder="Es. AA123BB" maxlength="7" id="input-targa">
                </div>
                <p id="targa-error" class="auth-error"></p>
                <button class="btn-landing btn-landing-small" onclick="cercaVeicoloVisitatore()">
                    <i class="fa-solid fa-search"></i> Cerca
                </button>
            </div>

            <div class="card hidden" id="card-dati-veicolo-visitor">
                <h3><i class="fa-solid fa-circle-check"></i> Dati Veicolo</h3>
                <div id="dati-veicolo-visitor"></div>
                <p class="visitor-cta">Vuoi salvare questo veicolo e gestire scadenze e prenotazioni?</p>
                <a href="register.html" class="btn-landing btn-landing-small">Registrati gratis</a>
            </div>

        </div>
    </section>

    <footer class="footer">
        <p>© 2025 — YouDrive</p>
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOUdrive — Scadenze</title>
    <link rel="stylesheet" href="style-base.css">
    <link rel="stylesheet" href="style-app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <div class="hamburger-overlay" id="hamburger-overlay" onclick="closeMenu()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="img/logo.png" alt="logo" class="sidebar-logo-img">
            <button class="sidebar-close" onclick="closeMenu()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <nav class="sidebar-nav">
            <a href="#"><i class="fa-solid fa-circle-info"></i> Info & Contatti</a>
            <a href="#"><i class="fa-solid fa-file-pdf"></i> Scarica Storico Interventi</a>
            <a href="#"><i class="fa-solid fa-gear"></i> Impostazioni</a>
            <a href="landing.html" class="sidebar-logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </nav>
    </div>

    <header class="header">
        <div class="header-left">
            <img src="img/logo.png" alt="logo" class="header-logo-img">
            <span class="header-brand">YouDrive</span>
            <button class="hamburger-btn" onclick="openMenu()"><i class="fa-solid fa-bars"></i></button>
        </div>
        <div class="header-right">
            <span class="header-nickname">nickname</span>
            <div class="header-avatar"><i class="fa-solid fa-user"></i></div>
        </div>
    </header>

    <section class="page-hero">
        <h2 class="section-title-page">Scadenze</h2>
    </section>

    <section class="section">
        <div class="section-row">
            <div class="card">
                <h3><i class="fa-solid fa-car"></i> Seleziona Veicolo</h3>
                <div class="input-group">
                    <i class="fa-solid fa-list"></i>
                    <select>
                        <option value="">— Nessun veicolo aggiunto —</option>
                    </select>
                </div>
            </div>
        </div>
    </section>

    <section class="section section-no-top">
        <div class="section-row scadenze-grid">

            <div class="card scadenza-card">
                <div class="card-icon"><i class="fa-solid fa-receipt"></i></div>
                <h3>Bollo Auto</h3>
                <p>Nessuna data impostata.</p>
                <button class="btn-landing btn-landing-small">
                    <i class="fa-solid fa-pen"></i> Imposta Data
                </button>
            </div>

            <div class="card scadenza-card">
                <div class="card-icon"><i class="fa-solid fa-screwdriver-wrench"></i></div>
                <h3>Revisione</h3>
                <p>Nessuna data impostata.</p>
                <button class="btn-landing btn-landing-small">
                    <i class="fa-solid fa-pen"></i> Imposta Data
                </button>
            </div>

            <div class="card scadenza-card">
                <div class="card-icon"><i class="fa-solid fa-oil-can"></i></div>
                <h3>Tagliando</h3>
                <p>Nessuna data impostata.</p>
                <button class="btn-landing btn-landing-small">
                    <i class="fa-solid fa-pen"></i> Imposta Data
                </button>
            </div>

        </div>
    </section>

    <footer class="footer">
        <p>© 2025 — YouDrive</p>
    </footer>

</body>
</html>

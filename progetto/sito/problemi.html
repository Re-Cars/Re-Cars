<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouDrive — Problemi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style-base.css">
    <link rel="stylesheet" href="style-app.css">
    <script src="functions-base.js" defer></script>
    <script src="functions-app.js" defer></script>
</head>

<body>

    <div class="hamburger-overlay" id="hamburger-overlay" onclick="closeMenu()"></div>

        <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="img/logo.png" alt="logo" class="sidebar-logo-img">
            <span class="sidebar-brand">YouDrive</span>
            <button class="sidebar-close" onclick="closeMenu()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <nav class="sidebar-nav">
            <a href="#"><i class="fa-solid fa-circle-info"></i> Info & Contatti</a>
            <a href="#"><i class="fa-solid fa-file-pdf"></i> Scarica Storico Interventi</a>
            <a href="#"><i class="fa-solid fa-gear"></i> Impostazioni</a>
            <a href="landing.html" class="sidebar-logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </nav>
    </div>

    <header class="header">
        <div class="header-left">
            <div class="hamburger9">
                <input type="checkbox" id="hamburger9-input">
                <label for="hamburger9-input">
                    <div class="hamburger9-container">
                        <span class="line line1"></span>
                        <span class="line line2"></span>
                        <span class="line line3"></span>
                        <span class="line line4"></span>
                    </div>
                </label>
            </div>
        </div>
        <div class="header-center">
            <img src="img/logo.png" alt="logo" class="header-logo-img">
            <span class="header-brand">YouDrive</span>
        </div>
        <div class="header-right">
            <span class="header-nickname" id="header-nickname">nickname</span>
            <div class="header-avatar">
                <i class="fa-solid fa-user"></i>
            </div>
        </div>
    </header>

    <div class="breadcrumb">
        <a href="homepage.html"><i class="fa-solid fa-house"></i> Home</a>
        <span>›</span>
        <span>Problemi</span>
    </div>

    <section class="page-hero">
        <h2 class="section-title-page">Diario Problemi</h2>
    </section>

    <section class="section">
        <div class="section-row">

            <div class="card">
                <h3><i class="fa-solid fa-triangle-exclamation"></i> Segnala un Problema</h3>
                <div class="input-group">
                    <i class="fa-solid fa-car"></i>
                    <select>
                        <option value="">— Seleziona veicolo —</option>
                    </select>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-calendar"></i>
                    <input type="date">
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-tag"></i>
                    <select>
                        <option value="">— Categoria —</option>
                        <option>Motore</option>
                        <option>Freni</option>
                        <option>Elettrico</option>
                        <option>Carrozzeria</option>
                        <option>Gomme</option>
                        <option>Altro</option>
                    </select>
                </div>
                <div class="input-group input-group-textarea">
                    <i class="fa-solid fa-pen"></i>
                    <textarea placeholder="Descrivi il problema..." rows="4"></textarea>
                </div>
                <button class="btn-landing btn-problemi">
                    <i class="fa-solid fa-plus"></i> Aggiungi
                </button>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-book"></i> Diario Problemi</h3>
                <p>Nessun problema segnalato.</p>
            </div>

        </div>
    </section>

    <footer class="footer" id="footer">
        <p>© 2025 — YouDrive</p>
    </footer>

</body>
</html>

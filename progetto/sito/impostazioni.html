  <section class="yd-accordion">
  <!-- Notifiche (con sottomenu) -->
    <div class="yd-accordion-row">
      <button class="yd-accordion-trigger" onclick="toggleYdSubmenu(this)">
        <span class="yd-dash">-</span>
        <span class="yd-label">Modalità di notifiche</span>
        <i class="fa-solid fa-chevron-down yd-arrow"></i>

      <div class="yd-submenu">

            In applicazione (piano gratuito)

        </div>

          <a href="#">
            <span class="yd-sub-dash">-</span>
            Tramite sms/email (piano standard e premium)
          </a>
        </div>
      </div>
    </div>
 
    <!-- Layout (con sottomenu) -->
    <div class="yd-accordion-row">
      <button class="yd-accordion-trigger" onclick="toggleYdSubmenu(this)">
        <span class="yd-dash">-</span>
        <span class="yd-label">Cambia sfondo</span>

      </button>

  <footer class="footer" id="footer">
        <p>© 2025 — YouDrive</p>
</footer>
<script>
 function toggleYdSubmenu(btn) {
      const submenu = btn.nextElementSibling;
      const isOpen = submenu.classList.contains('yd-open');
 
      // chiudi tutti gli altri sottomenu aperti
      document.querySelectorAll('.yd-submenu.yd-open').forEach(s => s.classList.remove('yd-open'));
      document.querySelectorAll('.yd-accordion-trigger.yd-open').forEach(b => b.classList.remove('yd-open'));
 
      // apri o chiudi quello cliccato
      if (!isOpen) {
        submenu.classList.add('yd-open');
        btn.classList.add('yd-open');
      }
    }
</script>
</body>

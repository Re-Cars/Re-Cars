<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouDrive — Recensioni</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style-base.css">
    <link rel="stylesheet" href="style-app.css">
    <script src="functions-base.js" defer></script>
    <script src="functions-app.js" defer></script>
</head>
<body>

    <div class="hamburger-overlay" id="hamburger-overlay" onclick="closeMenu()"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="img/logo.png" alt="logo" class="sidebar-logo-img">
            <span class="sidebar-brand">YouDrive</span>
                <div class="hamburger9">
                    <input type="checkbox" id="hamburger9-input">
                    <label for="hamburger9-input" onclick="openMenu()">
                        <div class="hamburger9-container">
                            <span class="line line1"></span>
                            <span class="line line2"></span>
                            <span class="line line3"></span>
                            <span class="line line4"></span>
                        </div>
                    </label>
                </div>
        </div>
        <nav class="sidebar-nav">
            <a href="#"><i class="fa-solid fa-circle-info"></i> Info & Contatti</a>
            <a href="#"><i class="fa-solid fa-file-pdf"></i> Scarica Storico Interventi</a>
            <a href="#"><i class="fa-solid fa-gear"></i> Impostazioni</a>
            <a href="landing.html" class="sidebar-logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </nav>
    </div>


    <header class="header">
        <div class="header-left">
            <button class="hamburger-btn" onclick="openMenu()">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
        <div class="header-center">
            <img src="img/logo.png" alt="logo" class="header-logo-img">
            <a href="homepage.html"><span class="header-brand">YouDrive</span></a>
        </div>
        <div class="header-right">
            <span class="header-nickname" id="header-nickname">nickname</span>
            <div class="header-avatar">
                <i class="fa-solid fa-user"></i>
            </div>
        </div>
    </header>

    <section class="page-hero">
        <h2 class="section-title-page">Recensioni</h2>
    </section>

    <section class="section">
        <div class="section-row">

            <div class="card">
                <h3><i class="fa-solid fa-pen-to-square"></i> Lascia una Recensione</h3>
                <p>Puoi recensire solo le officine dove hai prenotato.</p>
                <div class="input-group">
                    <i class="fa-solid fa-wrench"></i>
                    <select>
                        <option value="">— Seleziona prenotazione —</option>
                    </select>
                </div>
                <div class="stelle-container">
                    <p>Voto:</p>
                    <div class="stelle">
                        <i class="fa-solid fa-star stella"></i>
                        <i class="fa-solid fa-star stella"></i>
                        <i class="fa-solid fa-star stella"></i>
                        <i class="fa-solid fa-star stella"></i>
                        <i class="fa-solid fa-star stella"></i>
                    </div>
                </div>
                <div class="input-group input-group-textarea">
                    <i class="fa-solid fa-comment"></i>
                    <textarea placeholder="Scrivi la tua recensione..." rows="4"></textarea>
                </div>
                <button class="btn-landing btn-recensioni">
                    <i class="fa-solid fa-paper-plane"></i> Invia Recensione
                </button>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-star-half-stroke"></i> Le tue Recensioni</h3>
                <p>Non hai ancora lasciato recensioni.</p>
            </div>

        </div>
    </section>

    <footer class="footer" id="footer">
        <p>© 2025 — YouDrive</p>
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouDrive — Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="functions.js" defer></script>
</head>

<body class="auth-body">

    <div class="auth-card">

        <div class="auth-logo">
            <i class="fa-solid fa-car"></i>
            <h1 class="hero-title">YouDrive</h1>
            <p class="hero-subtitle">Gestisci il tuo veicolo in un click</p>
        </div>


        <div class="auth-tabs">
            <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Accedi</button>
            <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Registrati</button>
        </div>


        <div id="form-login" class="auth-form">
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="login-email" placeholder="Email">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="login-password" placeholder="Password">
            </div>
            <p id="login-error" class="auth-error"></p>
            <button class="btn-primary" onclick="login()">Accedi</button>
        </div>


        <div id="form-register" class="auth-form hidden">
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="reg-user" placeholder="Username">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="reg-email" placeholder="Email">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="reg-password" placeholder="Password">
            </div>
            <p id="reg-error" class="auth-error"></p>
            <button class="btn-primary" onclick="register()">Registrati</button>
        </div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Scarica YouDrive</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="download-page">

<section class="download-container">

    <div class="download-text">
        <h1 id="download-title" class="download-title">Scarica YouDrive</h1>
        <p id="download-slogan" class="download-slogan">Il controllo del tuo veicolo, sempre con te.</p>

        <div class="download-buttons">
            <a class="btn-store android" href="#" target="_blank">
                <i class="fa-brands fa-google-play"></i>
                <span>Scarica per Android</span>
            </a>

            <a class="btn-store ios" href="#" target="_blank">
                <i class="fa-brands fa-apple"></i>
                <span>Scarica per iOS</span>
            </a>
        </div>
    </div>

    <div class="download-image">
        <img src="img/consumi.png" alt="Mockup App YouDrive">
    </div>

</section>

</body>
</html>

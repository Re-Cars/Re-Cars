<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOUdrive — Home</title>
    <link rel="stylesheet" href="style-base.css">
    <link rel="stylesheet" href="style-app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="functions.js" defer></script>
</head>

<body>

    <div class="hamburger-overlay" id="hamburger-overlay" onclick="closeMenu()"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="img/logo.png" alt="logo" class="sidebar-logo-img">
            <button class="sidebar-close" onclick="closeMenu()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <nav class="sidebar-nav">
            <a href="#"><i class="fa-solid fa-circle-info"></i> Info & Contatti</a>
            <a href="#"><i class="fa-solid fa-file-pdf"></i> Scarica Storico Interventi</a>
            <a href="#"><i class="fa-solid fa-gear"></i> Impostazioni</a>
            <a href="landing.html" class="sidebar-logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </nav>
    </div>

    <header class="header">
        <div class="header-left">
            <img src="img/logo.png" alt="logo" class="header-logo-img">
            <span class="header-brand">YOUdrive</span>
            <button class="hamburger-btn" onclick="openMenu()">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
        <div class="header-right">
            <span class="header-nickname">nickname</span>
            <div class="header-avatar">
                <i class="fa-solid fa-user"></i>
            </div>
        </div>
    </header>

    <section class="home-intro">
        <div class="home-intro-veicolo">
            <div class="veicolo-dot"></div>
            <span>veicolo?</span>
        </div>
    </section>

    <section class="home-cards-section">
        <div class="home-cards-grid">

            <a href="info-veicolo.html" class="home-card card-veicolo">
                <i class="fa-solid fa-car"></i>
                <span>INFO VEICOLO</span>
            </a>

            <a href="problemi.html" class="home-card card-problemi">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>SEGNA PROBLEMI</span>
            </a>

            <a href="scadenze.html" class="home-card card-scadenze">
                <i class="fa-solid fa-receipt"></i>
                <span>SCADENZE PAGAMENTI</span>
            </a>

            <a href="prenotazioni.html" class="home-card card-prenotazioni">
                <i class="fa-solid fa-wrench"></i>
                <span>SOS + APPUNT. MECCANICO</span>
            </a>

            <a href="recensioni.html" class="home-card card-recensioni">
                <i class="fa-solid fa-calendar-check"></i>
                <span>SCADENZE CONTROLLI</span>
            </a>

        </div>
    </section>

    <div class="btn-aggiungi-container">
        <span class="btn-aggiungi-label">cerca e<br>aggiungi veicolo!</span>
        <a href="veicoli.html" class="btn-aggiungi">
            <i class="fa-solid fa-plus"></i>
        </a>
    </div>

    <footer class="footer">
        <p>© 2025 — YouDrive</p>
    </footer>

</body>
</html>

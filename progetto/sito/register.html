<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOUdrive — Registrazione</title>
    <link rel="stylesheet" href="style-base.css">
    <link rel="stylesheet" href="style-auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="functions.js" defer></script>
</head>

<body class="auth-body">

    <div class="landing-overlay"></div>

    <div class="auth-container">

        <a href="landing.html" class="auth-back">
            <i class="fa-solid fa-arrow-left"></i> Torna indietro
        </a>

        <div class="auth-logo">
            <img src="img/logo.png" alt="Logo YouDrive" class="auth-logo-img">
            <h1 class="landing-title">YouDrive</h1>
        </div>

        <div class="auth-form">
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="reg-user" placeholder="Username">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="reg-email" placeholder="Email">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="reg-password" placeholder="Password">
            </div>
            <p id="reg-error" class="auth-error"></p>
            <button class="btn-landing" onclick="register()">REGISTRATI</button>
        </div>

        <p class="auth-switch">Hai già un account? <a href="login.html">Accedi</a></p>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouDrive</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style-base.css">
    <link rel="stylesheet" href="style-auth.css">
    <script src="functions-base.js" defer></script>
    <script src="functions-auth.js" defer></script>

</head>

<body class="landing-body">

    <div class="landing-overlay"></div>

    <div class="landing-content">

        <div class="landing-logo">  
            <img src="img/logo.png" alt="Logo YouDrive" id="logo-img">
        </div>

        <h1 class="landing-title">YouDrive</h1>
        <p class="landing-subtitle"><i>tu guidi noi la gestiamo</i></p>

        <div class="landing-buttons">
            <a href="login.html" class="btn-landing">ACCEDI</a>
        </div>
        <div class="scroll-hint">
        <div class="scroll-arrows">
            <i class="fa-solid fa-chevron-up"></i>
            <i class="fa-solid fa-chevron-up"></i>
            <i class="fa-solid fa-chevron-up"></i>
        </div>
        <span>Scorri per provare</span>
    </div>
    </div>
    <div class="landing-search-section">
    <h3 class="landing-search-title"><i class="fa-solid fa-magnifying-glass"></i> Cerca un veicolo</h3>
    <p class="landing-search-sub">Inserisci una targa per visualizzare i dati del veicolo</p>
    <div class="input-group landing-input">
        <i class="fa-solid fa-car"></i>
        <input type="text" id="input-targa-visitor" placeholder="Es. AA123BB" maxlength="7">
    </div>
    <p id="targa-error" class="auth-error"></p>
    <button class="btn-landing" onclick="cercaVeicoloVisitatore()">
        <i class="fa-solid fa-search"></i> Cerca
    </button>
    <div class="card hidden" id="card-dati-veicolo-visitor" style="margin-top: 20px;">
        <h3><i class="fa-solid fa-circle-check"></i> Dati Veicolo</h3>
        <div id="dati-veicolo-visitor"></div>
        <p class="visitor-cta">Vuoi salvare questo veicolo e gestire scadenze e prenotazioni?</p>
        <a href="register.html" class="btn-landing">Registrati gratis</a>
    </div>
</div>
</body>
</html>
